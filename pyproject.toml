[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# F: pyflakes (undefined names, unused imports/vars), E9: syntax errors,
# I: import sorting. Kept minimal on purpose — high signal, no style noise.
select = ["F", "E9", "I"]

[tool.ruff.lint.isort]
# The repo has a local `telegram/` directory holding the bot, which collides
# with the installed python-telegram-bot package. Ruff versions disagree about
# whether `telegram` is therefore first-party — 0.6.9 and 0.16.3 sort this file
# differently — so a ruff upgrade alone would turn CI red. State it explicitly.
known-third-party = ["telegram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers/-config turn a typo'd marker or a stale option into an error
# instead of a silently skipped test.
addopts = ["--strict-markers", "--strict-config"]
# testpaths only applies when no path is given on the command line, so an
# explicit `pytest .` would otherwise walk the whole repo, including .venv.
norecursedirs = [
    ".git",
    ".venv",
    "venv",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "data",
    "frontend",
    "telegram",
]
