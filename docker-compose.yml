# Production-shaped base: code baked into the image, no live-reload mounts.
# For development, docker-compose.override.yml (auto-merged by
# `docker compose up`) adds bind mounts and --reload.
# Explicit production run: docker compose -f docker-compose.yml up -d
services:
  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - data_uploads:/app/data/uploads
      - data_chroma:/app/data/chroma_db
      # Collected ratings. Without a volume they lived in the container layer
      # and were lost on the next `docker compose up --build`, which is a poor
      # fate for the one thing users are asked to contribute.
      - data_feedback:/app/data/feedback
    env_file:
      - .env
    ports:
      # Bound to loopback: the API's only credential is one shared secret, and
      # user_id is unauthenticated client input, so it is not safe to expose.
      # Frontend and bot reach it over rag_net instead.
      # NOTE: the frontend below IS published on all interfaces and has no
      # authentication of its own while holding that same secret - put it
      # behind an authenticating reverse proxy on any untrusted network.
      - "127.0.0.1:8000:8000"
    healthcheck:
      # /ready, not /health: the two services below wait on this condition, and
      # /health answers 200 as soon as the process accepts a socket - which is
      # before the vector store is open. They would start and get 503s from a
      # backend Compose had already called healthy. Docker does not restart an
      # unhealthy container, so a failing check reports rather than acts.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - rag_net

  frontend:
    build: .
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - BACKEND_URL=http://backend:8000
    env_file:
      - .env
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag_net

  bot:
    build: .
    command: python -m clients.telegram_bot
    environment:
      - BACKEND_URL=http://backend:8000
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag_net

networks:
  rag_net:
    driver: bridge

volumes:
  data_uploads:
  data_chroma:
  data_feedback:
